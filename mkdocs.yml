site_name: lane
site_description: Parallel, port-conflict-free dev stacks.
site_url: https://dheeraj-nalapat.github.io/lane/
repo_url: https://github.com/Dheeraj-Nalapat/lane
docs_dir: docs/guide
exclude_docs: |
  README.md
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: cyan
    accent: cyan
  features:
    - navigation.top
    - content.code.copy
    - search.suggest
extra_css:
  - assets/lane.css
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Selecting services: selecting-services.md
  - Recipes:
    - Plain compose: recipes/compose.md
    - Tilt: recipes/tilt.md
    - Frontend HMR: recipes/frontend-hmr.md
  - HTTPS: https.md
  - Agents: agents.md
  - Command reference: commands.md
