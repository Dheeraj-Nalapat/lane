version: 2
builds:
  - main: .
    binary: lane
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dheeraj-nalapat/lane/cmd.Version={{ .Version }}
archives:
  - formats: [tar.gz]
    name_template: "lane_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
release:
  # Attach the installer so `…/releases/latest/download/install.sh` resolves.
  extra_files:
    - glob: install.sh
# Homebrew publishing is deferred until a `Dheeraj-Nalapat/homebrew-lane` tap
# exists. To enable later, add a `brews:` block pointing at that repo.
